name = "loftlife"
workers_dev = true
main = "src/cloudflare/worker.ts"
compatibility_date = "2026-11-25"
compatibility_flags = ["nodejs_compat"]

# Static client build served by the edge.
[assets]
directory = "./dist"
binding = "ASSETS"

# Multiplayer coordination: one durable object per city shard or world.
[[durable_objects.bindings]]
name = "REALTIME"
class_name = "LoftLifeRealtime"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LoftLifeRealtime"]

[observability]
enabled = true

[observability.traces]
enabled = true

# Required Worker secrets (set outside source control):
#   DATABASE_URL
#   LOFTLIFE_SESSION_SECRET
