name: Import CharacterCreator wardrobe assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out LoftLife
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import pinned CC0 GLB assets
        run: npm run assets:charactercreator

      - name: Upload imported models and provenance to R2
        env:
          CATALOG_R2_BUCKET: ${{ vars.CATALOG_R2_BUCKET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run assets:upload
