name: Deploy LoftLife to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 92d9592953c4d46474ae07993913f710
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LOFTLIFE_SESSION_SECRET: ${{ secrets.LOFTLIFE_SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Require production deployment credentials
        shell: bash
        run: |
          missing=()
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=("CLOUDFLARE_API_TOKEN")
          [[ -n "$DATABASE_URL" ]] || missing+=("DATABASE_URL")
          [[ -n "$LOFTLIFE_SESSION_SECRET" ]] || missing+=("LOFTLIFE_SESSION_SECRET")
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub Actions secrets: %s\\n' "${missing[*]}"
            exit 1
          fi
      - name: Configure Neon connection secret
        run: printf '%s' "$DATABASE_URL" | npx --yes wrangler@4 secret put DATABASE_URL
      - name: Configure session signing secret
        run: printf '%s' "$LOFTLIFE_SESSION_SECRET" | npx --yes wrangler@4 secret put LOFTLIFE_SESSION_SECRET
      - name: Deploy Worker and Durable Objects
        run: npx --yes wrangler@4 deploy
